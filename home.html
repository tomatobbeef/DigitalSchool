<!DOCTYPE html>
<html lang="en">

<head>
    <script include="vue,d3,proj4,geohash,geojson,shapefile,turf,mapv,echarts,elasticsearch,plugin,vue,antd"
        src="./mapgis/include-lib-local.js"></script>
    <script include="openlayers" src="./mapgis/include-openlayers-local.js"></script>
    <script src="tool.js"></script>
    <script src="layui.js"></script>
    <script src="sqlite\worker.sql-asm.js"></script>


    <!-- <script src="libmars/CesiumPlugins/heatmap/heatmap.min.js"></script> -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>数字孪生校园</title>

    <!-- loading层 -->
    <link rel="stylesheet" href="./lib/low-loading/low-loading.css">
    <script src="./lib/low-loading/low-loading.js"></script>

    <!-- 引入vue -->
    <script src="./lib/vue/vue.js"></script>

    <!-- 引入fetch包 -->
    <script src="./lib/fetch/fetch.js"></script>

    <!-- 引入cesium -->
    <script src="./mapgis/cdn/cesium/Cesium.js"></script>

    <!-- 引入heatmap -->
    <script src="./lib/heatmap.js"></script>

    <!-- cesium样式 -->
    <!-- <link rel="stylesheet" href="./lib/Cesium/Widgets/widgets.css"> -->

    <!-- 页面引导 -->
    <script src="./lib/intro/intro.js"></script>
    <link rel="stylesheet" href="./lib/intro/introjs.css">

    <!-- 滑动组件 -->
    <link rel="stylesheet" href="./lib/swiper/swiper.min.css">
    <script src="./lib/swiper/swiper.min.js"></script>

    <script src="./lib/echarts/4.3.0-rc.2/echarts-en.min.js"></script>

    <!-- 引入iview组件库 -->
    <link rel="stylesheet" type="text/css" href="./lib/iview/styles/iview.css">
    <script type="text/javascript" src="./lib/iview/iview.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- 引入JQ -->
    <script src="./lib/jquery/jquery-1.10.2.min.js"></script>

    <!-- 自定义样式 -->
    <link rel="stylesheet" type="text/css" href="layui.css">
    <link rel="stylesheet" href="./main.css?v5">
    <link rel="stylesheet" type="text/css" href="./new.css">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1,user-scalable=0,minimum-scale=1.0,maximum-scale=1.0" />
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="format-detection" content="telephone=no">
    <meta name="x5-fullscreen" content="true">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <link rel="stylesheet" href="widgets/tilescut/Cesium/Widgets/widgets.css">
    <title>模型压平</title>

    <link href="css/style.css" rel="stylesheet" />
    <style>
        .hasOffset {
            display: none;
        }
        #info {
            display: none;
            position: absolute;
            top: 50%;
            left: 35%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #info img {
            width: 100%;
            border-radius: 10px 10px 0 0;
            margin-bottom: 10px;
        }
        #info h3 {
            margin: 10px 0;
            color: #333;
            font-size: 1.2em;
        }
        #info p {
            color: #666;
            font-size: 0.9em;
            line-height: 1.5;
        }
        #play-button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #miniMap{
            position:absolute;
            left:20px;
            top:80px;
            width:400px;
            height:200px;
            border:2px solid #fff;
            border-radius:8px;
            overflow:hidden;
            display: none;
            }
            #mapImg{
            width:100%;
            height:100%;
            display:block;
            }
            #playerDot{
            position:absolute;
            width:8px;
            height:8px;
            background:rgb(110, 110, 245);
            border-radius:50%;
            transform:translate(-50%,-50%);
            pointer-events:none;
            }

    /* ==================== 测量工具栏（popup面板内） ==================== */
        #measure-toolbar {
            display: none; flex-direction: column; gap: 10px;
            padding: 10px 12px;
            pointer-events: auto;
        }
        #measure-toolbar.active { display: flex; }
        .measure-title { color: #00FFE4; font-size: 13px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid rgba(0, 255, 228, 0.3); display: flex; align-items: center; gap: 6px; }
        .measure-btn { background: rgba(0, 255, 228, 0.08); border: 1px solid rgba(0, 255, 228, 0.4); color: #00FFE4; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; font-family: inherit; width: 100%; justify-content: center; }
        .measure-btn:hover { background: rgba(0, 255, 228, 0.2); border-color: #00FFE4; box-shadow: 0 0 8px rgba(0, 255, 228, 0.4); }
        .measure-btn.active { background: rgba(0, 255, 228, 0.3); border-color: #00FFE4; box-shadow: 0 0 12px rgba(0, 255, 228, 0.6); }
        .measure-btn .icon { font-size: 14px; line-height: 1; }
        .measure-btn-sep { width: 100%; height: 1px; background: rgba(0, 255, 228, 0.3); }
        .measure-btn-danger { background: rgba(255, 80, 80, 0.1); border-color: rgba(255, 80, 80, 0.5); color: #ff8080; }
        .measure-btn-danger:hover { background: rgba(255, 80, 80, 0.25); border-color: #ff5050; color: #fff; }
        .measure-btn-close { background: rgba(217, 56, 56, 0.2); border-color: rgba(255, 80, 80, 0.6); color: #ff8080; }
        .measure-btn-close:hover { background: #d93838; border-color: #ff5050; color: #fff; }
        .measure-btn-back { background: rgba(0, 180, 255, 0.1); border: 1px solid rgba(0, 180, 255, 0.5); color: #40b8ff; margin-top: 6px; }
        .measure-btn-back:hover { background: rgba(0, 180, 255, 0.25); border-color: #40b8ff; color: #fff; box-shadow: 0 0 8px rgba(0, 180, 255, 0.4); }
        #measure-hint { display: none; background: rgba(0, 0, 0, 0.5); color: #00FFE4; padding: 8px 12px; border-radius: 6px; font-size: 11px; border: 1px solid rgba(0, 255, 228, 0.3); text-align: center; }
        #measure-hint.show { display: block; }
        #measure-result-panel { display: none; flex-direction: column; gap: 4px; padding: 8px 0; border-top: 1px solid rgba(0, 255, 228, 0.2); }
        #measure-result-panel.show { display: flex; }
        .result-title { font-size: 12px; font-weight: 600; color: #00FFE4; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .result-row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 11px; color: #bffbff; }
        .result-row .label { color: #7eb8da; }
        .result-row .value { color: #00FFE4; font-weight: 600; font-family: 'Consolas', monospace; font-size: 11px; }
        .result-clear { margin-top: 6px; width: 100%; padding: 6px; background: rgba(217, 56, 56, 0.2); border: 1px solid rgba(255, 80, 80, 0.5); color: #ff8080; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s; }
        .result-clear:hover { background: #d93838; color: #fff; }
        .measure-3d-label { position: absolute; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.75); color: #00FFE4; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-family: 'Consolas', monospace; border: 1px solid rgba(0, 255, 228, 0.5); pointer-events: none; white-space: nowrap; box-shadow: 0 0 8px rgba(0, 255, 228, 0.3); z-index: 50; }
    /* ==================== 实时数据浮窗（3DGS 室内） ==================== */
        #data-panel { position: absolute; top: 12px; left: 12px; z-index: 100; display: none; background: rgba(11, 21, 44, 0.92); border: 1px solid #27bdb7; border-radius: 10px; min-width: 220px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(39, 189, 183, 0.2); backdrop-filter: blur(12px); user-select: none; overflow: hidden; pointer-events: auto; }
        #data-panel.show { display: block; }
        .dp-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(0, 255, 228, 0.08); border-bottom: 1px solid rgba(0, 255, 228, 0.2); }
        .dp-header-title { color: #00FFE4; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .dp-close { background: none; border: none; color: #ff8080; font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s; line-height: 1; }
        .dp-close:hover { background: rgba(255, 80, 80, 0.3); color: #fff; }
        .dp-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
        .dp-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 12px; }
        .dp-label { color: #7eb8da; }
        .dp-value { color: #00FFE4; font-family: 'Consolas', 'Courier New', monospace; font-weight: 600; font-size: 12px; }
        .dp-value.warn { color: #ffb020; }
        .dp-value.good { color: #4caf50; }
        .dp-sep { height: 1px; background: rgba(0, 255, 228, 0.15); margin: 2px 0; }
        .dp-footer { padding: 6px 14px; border-top: 1px solid rgba(0, 255, 228, 0.2); font-size: 10px; color: #4a6a7a; text-align: right; }
    /* popup关闭按钮放到底部 */
        .popup-content > button {
            top: auto;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            width: 28px; height: 28px;
            border: 1px solid rgba(255, 80, 80, 0.5);
            background: rgba(217, 56, 56, 0.2);
            color: #ff8080;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-content > button:hover {
            background: #d93838;
            color: #fff;
        }
    </style>

</head>

<body>
    <div id="app" v-cloak>
        <!-- 初始化页面 -->
        <div class="init" v-if="initBool">
            <div>
                <button class="btn" @click="clickAccess">走进智慧校园</button>
                <em></em>
            </div>
        </div>

        <!-- head -->
        <div class="head" :class="headBool?'head-active':''">
            <div class="head-bg"><img src="./images/bg_1.png" alt=""></div>
            <div class="head-bg-left"><img src="./images/bg_l.png" alt=""></div>
            <div class="head-bg-right"><img src="./images/bg_r.png" alt=""></div>
            <div class="head-bg-l-l"><img src="./images/bg_l_l.png" alt=""></div>
            <div class="head-bg-r-r"><img src="./images/bg_r_r.png" alt=""></div>
            <div class="head-text">
                <p style="margin-top: 0px;font-size:35px">数字孪生校园2.0</p>
                <p style="margin-top: 0px;">Digital Twin School</p>
            </div>
            <div class="head-cont-l" style="color:#00FFE4;">
                <div>{{dateHour}}:{{dateMinu}}:{{dateSec}}</div>
                <div>
                    <span style="font-size: 1vw;font-weight: 600;">{{dateWeek}}</span>
                    <span style="font-size: 1vw;">{{dateYear}}年{{dateMonth}}月{{dateDate}}日</span>
                </div>
            </div>
            <div class="head-cont-r">
                <div><img src="./images/duoyun.png" alt=""></div>
                <div style="font-size: 1vw;font-weight: 600;color:#00FFE4;">多云 5℃-17℃</div>
            </div>
        </div>
        <div class="custom-iframe-container" :class="{ 'fly-in': iframeVisible, 'fly-out': !iframeVisible }">
            <iframe id="myFrame" v-if="iframeVisible" :src="iframeSrc" style="border: none;"></iframe>
        </div>
        <div :class="{ 'slide-in': isOpen }" class="popup-container">
            <div class="popup-content">
                <iframe id="newht" :src="externalUrl" frameborder="0" width="100%" height="100%"
                    style="border-style: solid;background:linear-gradient(to right, rgba(011, 21, 44, 0.4), rgba(11, 21, 44, 0.9));border-style: solid;border-color: #27bdb7;z-index: 2;"></iframe>
                <!-- 测量面板（覆盖 iframe） -->
                <div id="measure-panel-overlay" style="display:none; width:100%; height:100%; position:absolute; top:0; left:0; z-index:3; background:linear-gradient(to right, rgba(11, 21, 44, 0.4), rgba(11, 21, 44, 0.9)); border:1px solid #27bdb7; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto; padding:30vh 12px 15vh 12px; box-sizing:border-box;">
                    <div id="measure-toolbar">
                        <span class="measure-title">📏 测量工具</span>
                        <button class="measure-btn" id="btn-measure-distance" onclick="setMeasureMode('distance')"><span class="icon">📏</span><span>距离</span></button>
                        <button class="measure-btn" id="btn-measure-area" onclick="setMeasureMode('area')"><span class="icon">⬛</span><span>面积</span></button>
                        <button class="measure-btn" id="btn-measure-height" onclick="setMeasureMode('height')"><span class="icon">📐</span><span>高度</span></button>
                        <span class="measure-btn-sep"></span>
                        <button class="measure-btn measure-btn-danger" onclick="clearMeasure()"><span class="icon">🗑️</span><span>清除</span></button>
                        <div id="measure-hint"></div>
                        <div id="measure-result-panel">
                            <div class="result-title"><span>📊 测量结果</span><span id="result-count">0</span></div>
                            <div id="result-list"></div>
                            <button class="result-clear" onclick="clearMeasure()">清除全部</button>
                        </div>
                        <span class="measure-btn-sep"></span>
                        <button class="measure-btn measure-btn-back" onclick="exitMeasurePanel()"><span class="icon">↩</span><span>返回</span></button>
                    </div>
                </div>
                <button @click="closePopup"></button>
            </div>
        </div>



        <div class="nav-bottom-box" v-if="navNewBool" data-step="1" data-intro="导航栏可帮助您快捷选择分类!"
            v-show="(!mapSwitch)&&switchstatues == 2">
            <div @click="openPopup('widgets/tucengguanli/view.html')"
                :class="navState.indexOf('地图量测')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/mianji.png" alt=""></div>
                <div>图层管理</div>
            </div>
        </div>

        <div class="nav-bottom-box" v-if="navNewBool" data-step="1" data-intro="导航栏可帮助您快捷选择分类!"
            v-show="(!mapSwitch)&&switchstatues == 0">
            <div @click="openPopup('widgets/measure/view.html')"
                :class="navState.indexOf('地图量测')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/mianji.png" alt=""></div>
                <div>量测工具</div>
            </div>

            <div @click="openPopup('widgets/RealSenseSimulate/view.html')"
                :class="navState.indexOf('校园实景')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/jiedaoquyu.png" alt=""></div>
                <div>孪生校园</div>
            </div>

            <div @click="openPopup('widgets/Statistics/view.html')"
                :class="navState.indexOf('信息统计')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/shujudaping.png" alt=""></div>
                <div>信息统计</div>
            </div>

            <div @click="window.parent.document.location.href = 'widgets/tilescut/view.html'"
                :class="navState.indexOf('实景模拟')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/cheliangguanli.png" alt=""></div>
                <div>实时模型分析</div>
            </div>

            <div @click="openPopup('widgets/DigitalUniversity/view.html')"
                :class="navState.indexOf('数字校园算法')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/jingdian.png" alt=""></div>
                <div>查询分析工具</div>
            </div>
        </div>

        <div class="nav-bottom-box" v-if="navNewBool" data-step="1" data-intro="导航栏可帮助您快捷选择分类!"
            v-show="(!mapSwitch)&&switchstatues == 1">
            <div @click="fetchAndConvertGeoms()" :class="navState.indexOf('地图量测')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/mianji.png" alt=""></div>
                <div>模型同步</div>
            </div>

            <div @click="convertAndAddPolylines()" :class="navState.indexOf('校园实景')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/jiedaoquyu.png" alt=""></div>
                <div>路径同步</div>
            </div>
            <div @click="openPopup('widgets/RealSenseSimulate/view.html')"
                :class="navState.indexOf('校园实景')!=-1?'nav-bottom-box-item-act':''">
                <div><img src="./images/jiedaoquyu.png" alt=""></div>
                <div>孪生校园</div>
            </div>
        </div>
        <div id="container">
            <div id="openlayersMap" :style="{ width: leftWidth }"></div>
            <div id="buttonContainer">
                <button id="buttonleft" @click="expandLeft">&lt;&lt;</button>
                <button id="buttonright" @click="expandRight">&gt;&gt;</button>
            </div>
            <div id="three" :style="{ width: rightWidth, display: sagaVisible ? 'none' : 'block' }">
                <!-- 实时数据浮窗 -->
                <div id="data-panel">
                    <div class="dp-header">
                        <span class="dp-header-title">⚡ 实时数据</span>
                        <button class="dp-close" onclick="window.closeDataPanel()">✕</button>
                    </div>
                    <div class="dp-body">
                        <div class="dp-row"><span class="dp-label">🎯 FPS</span><span id="dp-fps" class="dp-value">--</span></div>
                        <div class="dp-row"><span class="dp-label">📐 分辨率</span><span id="dp-resolution" class="dp-value">--</span></div>
                        <div class="dp-sep"></div>
                        <div class="dp-row"><span class="dp-label">📍 相机 X</span><span id="dp-camx" class="dp-value">--</span></div>
                        <div class="dp-row"><span class="dp-label">📍 相机 Y</span><span id="dp-camy" class="dp-value">--</span></div>
                        <div class="dp-row"><span class="dp-label">📍 相机 Z</span><span id="dp-camz" class="dp-value">--</span></div>
                        <div class="dp-sep"></div>
                        <div class="dp-row"><span class="dp-label">🎮 场景对象</span><span id="dp-objects" class="dp-value">--</span></div>
                        <div class="dp-row"><span class="dp-label">💾 高斯数</span><span id="dp-splats" class="dp-value">--</span></div>
                        <div class="dp-row"><span class="dp-label">📋 Draw Calls</span><span id="dp-drawcalls" class="dp-value">--</span></div>
                    </div>
                    <div class="dp-footer"><span id="dp-time">--</span></div>
                </div>
            </div>
            <div id="cesiumMap" :style="{ width: rightWidth }"></div>
        </div>

        <!-- swiper图片预览模块 --> 
        <div class="swiper-box" v-if="swiperImgBool">
            <div class="swiper-close-btn btn" @click="closeSwiperBox"
                style="border: 1px solid #56FFFF;font-size: 1vw;font-weight: 600;">关闭</div>
            <div class="swiper-container gallery-top">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" v-for="(item,i) in swiperImgArr" :key="i"
                        :style="`background-image:url(${item})`"></div>
                </div>
                <!-- Pagination -->
                <div class="swiper-pagination"></div>
                <!-- Arrows -->
                <!-- <div class="swiper-button-next swiper-button-white"></div>
              <div class="swiper-button-prev swiper-button-white"></div> -->
            </div>
        </div>

        <!-- 地图气泡弹框 -->
        <div class="dynamic-layer" id="one">
            <div class='line'></div>
            <div class="main" id="tip"
                style="position: absolute;left: -370px;top: -540px;transform: matrix(0.892196, 0, 0, 0.892196, 378.334, 287.318);transform-origin: left bottom 0px;width: 300px;height: 240px;border-radius: 4px;background: url('./img/div2.png') 0% 0% / 100% 100% no-repeat;animation: 5s ease 0s infinite normal none running mymove;display: block;">
                <div class="main_tit"
                    style="position: inherit;top: 38px;left: 80px;font-size: 14px;text-align: left;color: rgb(255, 255, 255);text-shadow: rgba(0, 0, 0, 0.75) 0px 0px 9px;">
                </div>
                <div class="main_con"
                    style="position: inherit;font-size: 14px;top: 68px;left: 60px;width: 220px;text-align: left;color: rgb(255, 255, 255);">
                </div>
            </div>
        </div>
    </div>
    <div>
        <div>
            <div id="people">8896人</div>
            <div style="color:#00FFE4;">游客总人数</div>
        </div>
    </div>

    <!-- 标记点 -->
    <div id="info">
        <img src="marker.png" alt="Marker" style="width: 100%; border-radius: 10px 10px 0 0;">
        <h3 id="info-title"></h3>
        <p id="info-description"></p>
        <button id="play-button" style="padding: 5px 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
            <i class="fas fa-play"></i> 播放介绍
        </button>
    </div>

    <div id="miniMap">
        <img id="mapImg" src="src\assets\img\floor2.png" />
        <div id="playerDot"></div>
      </div>

    <!-- <script type="module" src="/src/main.ts"></script> -->
    <script src="main.vue"></script>
    <script type="module" src="./main.js"></script>
    <script type="module" src="widgets/three/main.js"></script>
</body>

</html>
