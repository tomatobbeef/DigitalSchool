<!DOCTYPE html>
<html lang="ch">

<head>
  <title>弹窗子页面</title>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <!-- 移动设备 viewport -->
  <meta name="viewport"
    content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,minimal-ui" />
  <meta name="author" content="https://www.cqism.cn/ " />
  <!-- 360浏览器默认使用Webkit内核 -->
  <meta name="renderer" content="webkit" />
  <!-- Chrome浏览器添加桌面快捷方式（安卓） -->
  <link rel="icon" type="image/png" href="../../img/favicon/favicon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Safari浏览器添加到主屏幕（IOS） -->
  <link rel="icon" sizes="192x192" href="img/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="" />
  <!-- Win8标题栏及ICON图标 -->
  <link rel="apple-touch-icon-precomposed" href="../../img/favicon/apple-touch-icon.png" />
  <meta name="msapplication-TileImage" content="../../img/favicon/app-icon72x72@2x.png" />
  <meta name="msapplication-TileColor" content="#62a8ea" />

  <!-- 第3方lib引入 -->
  <!--<script type="text/javascript" src="../../libmars/include-lib.js?time=20191008" libpath="../../libmars/"
                include="jquery,font-awesome,bootstrap,admui-frame"></script>-->
  <!-- 引入cesium -->
  <script src="../../../mapgis/cdn/cesium/Cesium.js"></script>
  <script src="../../../lib/jquery/jquery-1.10.2.min.js"></script>
  <!-- 引入vue -->
  <script src="../../../lib/vue/vue.js"></script>
  <script src="view.js"></script>
  <script src="../widget.js"></script>
  <link href="../../../css/widget-win.css" rel="stylesheet" />
  <link href="../../../new.css" rel="stylesheet" />

  <style>
    .btn_none {
      background: none;
      /*color: #bffbff;*/
      color: #30bbff;
      font-size: 12px;
    }

    .btn_none:hover {
      color: #00ffff;
    }

    .btn-group {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      padding-left: 20px;
      margin-top: 100px;
    }

    .tool-btn {
      cursor: pointer;
      user-select: none;
      min-width: 62px;
      height: 96px;
      box-sizing: border-box;
      margin: 0 26px 10px 0;
      text-align: center;
      color: #16608f;
      /* border:#30bbff 1px solid; */
    }

    .tool-thum {
      width: 45px;
      height: 45px;
      margin: 0 auto;
      /*border-radius: 50%;*/
      margin-bottom: 10px;
      /*background: #fd960f;*/
      cursor: pointer;
      background: url("../image/iconButtonBg.png") bottom center no-repeat;
      background-size: 100% 100%;
    }

    .tool-thum:hover {
      background: url("../image/iconButtonBg_h.png") bottom center no-repeat;
      background-size: 100% 100%;
    }

    .tool-thum img {
      width: 22px;
      height: 22px;
      margin: 11px;
      fill: #30bbff;
    }

    /*清空按钮*/
    #btn_measure_clear {
      background: url("../../img/UI/button_b.png") bottom center no-repeat;
      background-size: 100% 100%;
      color: #30bbff;
      margin-top: 15px;
      width: 135px;
      /*border-radius: 15px;*/
      padding-left: 30px;
      padding-right: 30px;
    }

    #btn_measure_clear:hover {
      background: url("../../img/UI/button_h.png") bottom center no-repeat;
      background-size: 100% 100%;
      color: #fff;
      margin-top: 15px;
      /*border-radius: 15px;*/
      padding-left: 30px;
      padding-right: 30px;
    }

    /*下拉菜单*/
    .form-control {
      /*清除原样式*/
      -webkit-appearance: none;
      /* google */
      -moz-appearance: none;
      /* firefox */
      appearance: none;
      /* IE */

      /*width: 150px;*/
      border: 1px solid #00ffff;
      background: #16608f;
      color: #00ffff;
      border-radius: 0px;
      /*margin-right: 10px;*/
    }

    option {
      background: #16608f;
      border: 1px solid #00ffff;
      padding-right: 10px;
      padding-left: 10px;
      -webkit-appearance: none;
      appearance: none;
      color: #00ffff;
    }

    option:hover {
      background-color: #00fff4;
      border: none;
    }
  </style>
</head>

<body style="padding: 0; text-align: center; margin: 0; height: 100vh; overflow: hidden;">
  <!-- 原始视图：场景选择 + 按钮组 -->
  <div id="originalView" style="display: block; height: 100%; padding: 5px; box-sizing: border-box;">
    <select name="pets" id="sel" style="width: 70%; position: absolute; left: 0%">
      <option value="">--请选择--</option>
    </select>
    <button id="sr" style="width: 20%; position: absolute; right: 5%; top: 20px">
      进入
    </button>
    <div class="btn-group">
      <div id="btn_measure_length" class="tool-btn" onclick="showSit()">
          <div class="tool-thum"><img src="../image/measure-length.svg"></div>
          <span class="btn_none"> 景点介绍 </span>
      </div>
      <div id="btn_measure_length" class="tool-btn" onclick="showmap()">
          <div class="tool-thum"><img src="../image/measure-length2.svg"></div>
          <span class="btn_none"> 地图导览 </span>
      </div>
      <div id="btn_smart_segment" class="tool-btn" onclick="smartSegment()">
          <div class="tool-thum"><img src="../image/measure-section.svg"></div>
          <span class="btn_none"> 智能分割 </span>
      </div>
    </div>
  </div>

  <!-- SAGA 视图（点击智能分割后显示） -->
  <div id="sagaView" style="display: none; height: 100%; flex-direction: column; box-sizing: border-box;">
    <div class="saga-inline-header">
      <span class="saga-inline-title">🎯 智能分割</span>
      <button class="saga-inline-exit" onclick="closeSaga()">
        <span>✕</span> 退出
      </button>
    </div>
    <div class="saga-inline-content">
      <iframe id="sagaFrame" src="../../../widgets/saga/view.html" frameborder="0" width="100%" height="100%"></iframe>
    </div>
  </div>

  <style>
    /* SAGA 内嵌视图样式 */
    #sagaView {
      background: #151515;
    }
    .saga-inline-header {
      height: 38px;
      background: linear-gradient(to right, rgba(11, 21, 44, 0.95), rgba(11, 21, 44, 0.7));
      border-bottom: 1px solid #27bdb7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }
    .saga-inline-title {
      color: #00FFE4;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .saga-inline-exit {
      background: #d93838;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .saga-inline-exit:hover {
      background: #ff4a4a;
      transform: scale(1.05);
    }
    .saga-inline-content {
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    .saga-inline-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
  <script type="module"></script>
</body>

</html>
